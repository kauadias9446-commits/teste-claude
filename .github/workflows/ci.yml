name: CI
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: |
          cd apps/web
          pnpm install
      - name: Typecheck
        run: |
          cd apps/web
          pnpm prisma:generate || true
      - name: Build
        run: |
          cd apps/web
          pnpm build
